name: OMSZ historikus adatok

on:
  schedule:
    - cron: "0 4 5 * *"   # havonta egyszer, 5-én 04:00 UTC (historikus lassan változik)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Függőségek
        run: pip install requests
      - name: OMSZ historikus letöltés és feldolgozás
        run: python scripts/fetch_historical.py
      - name: Commit és push
        run: |
          git config user.name  "Historikus Bot"
          git config user.email "bot@notox.hu"
          git add data/historical/
          if git diff --staged --quiet; then echo "Nincs változás."; exit 0; fi
          git commit -m "📚 OMSZ historikus $(date -u '+%Y-%m-%d')"
          # Rebase-retry: párhuzamos bot-push ütközés ellen
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && { echo "Push OK ($i)"; exit 0; }
            echo "Push retry $i…"; sleep $((i*5))
          done
          echo "Push sikertelen 5 próbálkozás után"; exit 1

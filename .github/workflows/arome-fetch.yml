name: AROME 2.5km frissítés

on:
  schedule:
    # AROME futási idők: 00, 06, 12, 18 UTC — OMSZ ~1-2h után publikál
    - cron: "30 2,8,14,20 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Soros futás minden adat-író workflow-val (közös group) → nincs push-verseny a main-en
concurrency:
  group: notox-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Függőségek
        run: pip install netCDF4 xarray numpy requests shapely
      - name: AROME letöltés és feldolgozás
        run: python scripts/fetch_arome.py
      - name: Commit és push
        run: |
          git config user.name  "AROME Bot"
          git config user.email "bot@notox.hu"
          git add data/arome_hungary.json
          if git diff --staged --quiet; then echo "Nincs változás."; exit 0; fi
          git commit -m "🌦 AROME 2.5km $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Rebase-retry: párhuzamos bot-push ütközés ellen
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && { echo "Push OK ($i)"; exit 0; }
            echo "Push retry $i…"; sleep $((i*5))
          done
          echo "Push sikertelen 5 próbálkozás után"; exit 1

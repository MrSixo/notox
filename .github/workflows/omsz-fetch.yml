name: OMSZ mérések frissítés

on:
  schedule:
    # Óránként — az OMSZ forrás (HABP_1H) óránként frissül, ezzel lépést tartunk.
    # A GitHub-cron jitterezhet/kihagyhat; a több futás több esélyt ad a friss adatra.
    # A measurements.html jelzi az adat korát (>3h → figyelmeztetés).
    - cron: "10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Soros futás minden adat-író workflow-val (közös group) → nincs push-verseny a main-en
concurrency:
  group: notox-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: OMSZ letöltés
        run: python scripts/fetch_omsz.py
      - name: Commit és push
        run: |
          git config user.name  "OMSZ Bot"
          git config user.email "bot@notox.hu"
          git add data/omsz_latest.json
          git diff --staged --quiet \
            && echo "Nincs változás." \
            || (git commit -m "📡 OMSZ mérések $(date -u '+%Y-%m-%d %H:%M UTC')" && git push)
